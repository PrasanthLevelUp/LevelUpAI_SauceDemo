name: Verify Successful Login

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Verify Successful Login Spec
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run verify-successful-login spec
        env:
          BASE_URL: https://www.saucedemo.com
          SAUCE_PASSWORD: secret_sauce
        run: npx playwright test tests/verify-successful-login-with-valid-credentials.spec.ts

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valid-login-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valid-login-test-results
          path: |
            test-results/
            test-results.json
          retention-days: 14
